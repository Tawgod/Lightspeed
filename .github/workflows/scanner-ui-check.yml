name: Scanner review UI regression
on:
  push:
    branches: [feature/scanner-fields-create-preview, feature/scanner-review-auto-lookup, feature/scanner-sku-role-diagnostics, feature/scanner-duplicate-safety-review-20261027]
    paths:
      - 'extension/**'
      - 'services/scannerSupplierTemplates.js'
      - 'tests/scannerSupplierTemplates.test.js'
      - 'timeclock/scannerLightspeedRoles.js'
      - 'timeclock/server.js'
      - 'extension/product-scanner/special-orders-adapter.js'
      - 'tests/scannerLightspeedRoles.test.js'
      - 'tests/lightspeedOrderDetection.test.cjs'
      - 'tests/scannerAcdCapture.test.cjs'
      - 'routes/scannerMatchGateway.js'
      - 'tests/scannerReviewAutoMatch.test.js'
      - 'tests/scannerDuplicateSafety.test.js'
      - 'extension/product-scanner/completeness.js'
      - 'routes/specialOrderProducts.js'
      - 'services/scannerTimeclockGateway.js'
      - 'services/scannerTimeclockIdentity.js'
      - 'server.js'
      - 'services/scannerPreorderStaging.js'
      - 'tests/scannerPreorderStaging.test.js'
      - '.github/workflows/scanner-ui-check.yml'
jobs:
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check extension JavaScript
        run: |
          node --check server.js
          node --check services/scannerPreorderStaging.js
          node --check routes/scannerMatchGateway.js
          node --check services/scannerTimeclockGateway.js
          node --check services/scannerTimeclockIdentity.js
          node --check timeclock/server.js
          node --check timeclock/scannerLightspeedRoles.js
          node --check extension/content.js
          node --check extension/product-scanner/page-capture.js
          node --check extension/popup.js
          node --check extension/product-scanner/review.js
          node --check extension/product-scanner/completeness.js
          node --check routes/specialOrderProducts.js
          node --check extension/product-scanner/special-orders-adapter.js
      - name: Assert revised UI fields and safe creation flow
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const review=fs.readFileSync('extension/product-scanner/review.js','utf8');
          const html=fs.readFileSync('extension/product-scanner/review.html','utf8');
          const popup=fs.readFileSync('extension/popup.js','utf8');
          const capture=fs.readFileSync('extension/product-scanner/page-capture.js','utf8');
          assert.match(review,/supplierSku/);
          assert.match(review,/const keys=\['name','sku','supplierSku','upc','brand','cost','msrp','weight','imageUrl','mapPrice'\]/);
          assert.doesNotMatch(review,/manufacturerPartNumber|currency/i);
          assert.match(html,/id="create-item"/);
          assert.match(html,/id="create-preview"/);
          assert.match(review,/lastMatches.length/);
          assert.match(review,/queueProductLookup/);
          assert.match(review,/capturedSupplierSku/);
          assert.match(review,/matchingLightspeedSku/);
          assert.match(review,/lookupSuppliers/);
          assert.doesNotMatch(html,/id="original"|id="existing"/);
          assert.match(html,/class="compact-sign-in"/);
          assert.match(html,/id="add-to-preorder"/);
          assert.match(html,/id="preorder-campaign"/);
          assert.match(review,/loadPreorderCampaigns/);
          assert.doesNotMatch(review,/fetch\([^)]*\/create/);
          assert.match(capture,/upcCandidates/);
          assert.match(capture,/acdSupplierSku\|\|str\(p.sku\)/);
          assert.match(popup,/captureSupplierProductPage/);
          assert.match(review,/id\('scan-open-supplier'\)|getElementById\('scan-open-supplier'\)/);
          console.log('Scanner UI field and read-only create proposal assertions passed');
          JS
      - name: Verify ACD screenshot-based extraction fixtures
        run: node --test tests/scannerAcdCapture.test.cjs
      - name: Verify permission-gated supplier template registry
        run: node --test tests/scannerSupplierTemplates.test.js
      - name: Verify linked Lightspeed user role eligibility
        run: node --test tests/scannerLightspeedRoles.test.js
      - name: Verify Lightspeed sale and invoice detection
        run: node --test tests/lightspeedOrderDetection.test.cjs
      - name: Verify automatic scanner product match metadata
        run: node --test tests/scannerReviewAutoMatch.test.js
      - name: Verify guarded preorder campaign staging
        run: node --test tests/scannerPreorderStaging.test.js
      - name: Verify scanner duplicate and completeness safeguards
        run: node --test tests/scannerDuplicateSafety.test.js
