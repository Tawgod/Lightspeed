name: Package Scanner Unpacked Preview
on:
  workflow_dispatch:
  push:
    branches: [feature/scanner-fields-create-preview, feature/scanner-review-auto-lookup, release/scanner-v0.3.25-beta-20261027]
    paths:
      - 'extension/**'
      - '.github/workflows/scanner-preview-package.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify extension scripts
        run: |
          node --check extension/popup.js
          node --check extension/content.js
          node --check extension/product-scanner/review.js
          node --check extension/product-scanner/completeness.js
          node --check timeclock/server.js
          node --test tests/scannerBetaUi.test.js
          node --test tests/scannerIsolatedTestCreation.test.js
          node --test tests/scannerProductReviewQueue.test.js
          node --test tests/scannerDuplicateSafety.test.js
          node --test tests/scannerEmployeeAccess.test.js
          node --test tests/scannerAcdCapture.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Hobby-Corner-Toolkit-v0.3.25-scanner-UI-beta-unpacked
          path: extension/
          retention-days: 30
