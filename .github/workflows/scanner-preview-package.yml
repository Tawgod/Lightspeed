name: Package Scanner Unpacked Preview
on:
  workflow_dispatch:
  push:
    branches: [feature/scanner-fields-create-preview, feature/scanner-review-auto-lookup, release/scanner-v0.3.24-test]
    paths:
      - 'extension/**'
      - '.github/workflows/scanner-preview-package.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify extension scripts
        run: |
          node --check extension/popup.js
          node --check extension/content.js
          node --check extension/product-scanner/review.js
          node --check extension/product-scanner/special-orders-adapter.js
          node --test tests/scannerSkuDefaults.test.js
          node --test tests/scannerLightspeedRoles.test.js
          node --check timeclock/server.js
          node --test tests/scannerAcdCapture.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Hobby-Corner-Scanner-v0.3.24-unpacked-preview
          path: extension/
          retention-days: 30
