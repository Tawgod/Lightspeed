name: Operator-controlled first Owner activation
on:
  pull_request:
    branches: [feature/owner-activation-browser-20261110]
    paths:
      - 'db/hc_first_owner_operator_activation.sql'
      - 'services/security/operatorFirstOwnerPasskeyCandidate.js'
      - 'tests/operator-first-owner-postgres.test.mjs'
      - 'routes/firstOwnerActivation.js'
      - 'services/security/isolatedFirstOwnerSetup.js'
      - 'services/security/ownerPasskeyTotpEnrollmentCandidate.js'
      - 'tests/owner-passkey-totp-enrollment-postgres.test.mjs'
      - 'staff-security.html'
      - 'staff-security-client.js'
      - 'tests/owner-authenticator-ui-contract.test.mjs'
      - 'owner-setup/**'
      - 'tests/first-owner-activation-router.test.mjs tests/owner-passkey-totp-enrollment-postgres.test.mjs tests/primary-timeclock-totp-subsystem.test.mjs tests/shared-staff-security.test.mjs tests/owner-authenticator-ui-contract.test.mjs'
      - '.github/workflows/first-owner-operator-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  operator-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hc_test
          POSTGRES_PASSWORD: hc_test
          POSTGRES_DB: hc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hc_test -d hc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HC_TEST_DATABASE_URL: postgres://hc_test:hc_test@127.0.0.1:5432/hc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-operator-owner-${{ hashFiles('package.json') }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          node --check services/security/operatorFirstOwnerPasskeyCandidate.js
          node --check routes/firstOwnerActivation.js
          node --check services/security/isolatedFirstOwnerSetup.js
          node --check services/security/ownerPasskeyTotpEnrollmentCandidate.js
          node --check staff-security-client.js
          node --check owner-setup/client.js
      - run: node --test --test-concurrency=1 tests/operator-first-owner-postgres.test.mjs tests/first-owner-passkey-registration-postgres.test.mjs tests/first-owner-activation-router.test.mjs
