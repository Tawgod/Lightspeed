name: Inventory M12 reusable adapter
on:
  pull_request:
    branches: [test/hc-foundation-combined-v9-20261125]
    paths:
      - 'services/lightspeed/inventoryAdapterM12.js'
      - 'tests/inventory-m12-postgres.test.mjs'
      - '.github/workflows/hc-inventory-m12.yml'
permissions:
  contents: read
jobs:
  offline:
    if: github.head_ref == 'feature/inventory-foundation-m12-v9-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hc_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: hc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hc_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HC_TEST_DATABASE_URL: postgres://hc_test:disposable_ci_only@localhost:5432/hc_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ee4e417fcfc1ae4358b0e256ccd8a8dee9073ecd
          path: .security-source
          persist-credentials: false
      - name: Verify exact dependencies
        run: |
          git rev-parse HEAD
          test "$(git -C .security-source rev-parse HEAD)" = "ee4e417fcfc1ae4358b0e256ccd8a8dee9073ecd"
          test "$(git -C .security-source hash-object tests/fixtures/hc-secure-s25h-contract.mjs)" = "d04a6db6995e982371c2f7ea25a43faf64090279"
          test "$(git -C .security-source hash-object tests/fixtures/hc-secure-s25e-role-policy.mjs)" = "79c99f79252f0cc391d0a5c6be7d73f21dd60ff9"
          test "$(git -C .security-source hash-object tests/fixtures/hc-secure-s25g-lifecycle.mjs)" = "e82a630c567294df0b58d0efc8bac32d3c3a0d73"
          test "$(git hash-object services/lightspeed/domainAdapterM10.js)" = "70f5a4cfc3f111f83c493b8fe5f6f3dfb5e62fa4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node --check services/lightspeed/inventoryAdapterM12.js && node --check tests/inventory-m12-postgres.test.mjs
      - run: node --test tests/inventory*.test.mjs
