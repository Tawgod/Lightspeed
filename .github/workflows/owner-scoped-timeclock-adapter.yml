name: Owner scoped Timeclock adapter
on:
  push:
    branches:
      - feature/owner-staging-scoped-timeclock-adapter-20261110
  pull_request:
    paths:
      - 'services/scannerTimeclockIdentity.js'
      - 'services/security/ownerTimeclockStagingBundle.js'
      - 'scripts/issue-owner-stage-activation.mjs'
      - 'tests/owner-staging-scoped-timeclock.test.mjs'
      - '.github/workflows/owner-scoped-timeclock-adapter.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: hc_test
          POSTGRES_PASSWORD: hc_test
          POSTGRES_DB: hc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hc_test -d hc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HC_TEST_DATABASE_URL: postgres://hc_test:hc_test@127.0.0.1:5432/hc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check relevant syntax
        run: |
          node --check services/scannerTimeclockIdentity.js
          node --check services/security/ownerTimeclockStagingBundle.js
          node --check scripts/issue-owner-stage-activation.mjs
      - name: Install source dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run scoped transport and full inherited Owner suite
        run: |
          node --test --test-concurrency=1 \
            tests/owner-staging-scoped-timeclock.test.mjs \
            tests/operator-first-owner-postgres.test.mjs \
            tests/first-owner-passkey-registration-postgres.test.mjs \
            tests/first-owner-activation-router.test.mjs \
            tests/owner-passkey-totp-enrollment-postgres.test.mjs \
            tests/owner-authenticator-ui-contract.test.mjs \
            tests/primary-timeclock-totp-subsystem.test.mjs \
            tests/shared-staff-security.test.mjs \
            tests/employee-admin-multiple-owners-postgres.test.mjs \
            tests/employee-admin-multiple-owners-router.test.mjs \
            tests/employee-admin-delegations-postgres.test.mjs \
            tests/employee-admin-owner-commissioning.test.mjs \
            tests/employee-admin-delegated-router.test.mjs \
            tests/owner-security-staging-mount.test.mjs \
            tests/owner-timeclock-staging-bundle.test.mjs \
            tests/owner-staging-database-preflight.test.mjs \
            tests/owner-operator-activation-cli.test.mjs
