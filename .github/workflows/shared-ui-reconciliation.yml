name: Shared UI reconciliation
on:
  push:
    branches: ['feature/shared-ui-foundation-reconcile-20261028']
  pull_request:
    paths:
      - 'shared-ui/**'
      - 'tests/shared-ui-reconciliation.test.mjs'
      - '.github/workflows/shared-ui-reconciliation.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/shared-ui-reconciliation.test.mjs
