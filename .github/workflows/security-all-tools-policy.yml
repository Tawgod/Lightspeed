name: Hobby Corner cross-tool security policy
on:
  push:
    branches: [integration/security-all-tools-20261111]
    paths:
      - 'services/security/staffAccessBaseline.js'
      - 'services/security/adminPermissionCatalog.js'
      - 'tests/security-all-tools-operations.test.mjs'
      - 'services/security/coreOperationsRouteInventory.js'
      - 'tests/core-operations-route-inventory.test.mjs'
      - 'special-orders.js'
      - 'routes/specialOrderProducts.js'
      - 'tests/special-orders-auth-metadata.test.mjs'
      - 'services/lightspeed/permissions.js'
      - 'services/lightspeed/secureReadPolicy.js'
      - 'routes/sharedLightspeedRead.js'
      - 'tests/shared-lightspeed-permissions.test.mjs'
      - 'tests/shared-lightspeed-secure-read.test.mjs'
      - '.github/workflows/security-all-tools-policy.yml'
  pull_request:
    paths:
      - 'services/security/staffAccessBaseline.js'
      - 'services/security/adminPermissionCatalog.js'
      - 'tests/security-all-tools-operations.test.mjs'
      - 'services/security/coreOperationsRouteInventory.js'
      - 'tests/core-operations-route-inventory.test.mjs'
      - 'special-orders.js'
      - 'routes/specialOrderProducts.js'
      - 'tests/special-orders-auth-metadata.test.mjs'
      - '.github/workflows/security-all-tools-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-all-tools-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared security code syntax
        run: |
          node --check services/security/staffAccessBaseline.js
          node --check services/security/staffSecurityBridge.js
          node --check services/security/adminPermissionCatalog.js
          node --check tests/security-all-tools-operations.test.mjs
      - name: Test all cataloged tool actions with registered station, TOTP and passkey proof
        run: |
          node --test --test-concurrency=1 \
            tests/shared-staff-security.test.mjs \
            tests/shared-staff-bridge.test.mjs \
            tests/security-all-tools-operations.test.mjs
      - name: Install isolated HTTP test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test secure Lightspeed read grants and denied HTTP access
        run: |
          node --check services/lightspeed/permissions.js
          node --check services/lightspeed/secureReadPolicy.js
          node --check routes/sharedLightspeedRead.js
          node --test --test-concurrency=1 \
            tests/shared-lightspeed-permissions.test.mjs \
            tests/shared-lightspeed-secure-read.test.mjs
      - name: Inventory Special Orders, Ordering, GW and product route security without changing live authorization
        run: |
          node --check services/security/coreOperationsRouteInventory.js
          node --check tests/core-operations-route-inventory.test.mjs
          node --test --test-concurrency=1 tests/core-operations-route-inventory.test.mjs
      - name: Verify Special Orders health metadata and legacy auth compatibility
        run: node --test --test-concurrency=1 tests/special-orders-auth-metadata.test.mjs
