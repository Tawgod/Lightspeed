name: Consignment Beta smoke
on:
  push:
    branches:
      - feature/consignment-layout-foundation
    paths:
      - 'consignment-beta.*'
      - 'consignment-customer.*'
      - 'services/consignmentFormRules.js'
      - 'server.js'
      - 'services/consignmentProductPreview.js'
      - 'services/consignmentMatcher.js'
      - 'extension/product-scanner/special-orders-adapter.js'
      - 'tests/consignment-beta.test.mjs'
      - '.github/workflows/consignment-beta-smoke.yml'
  pull_request:
    paths:
      - 'consignment-beta.*'
      - 'server.js'
      - 'services/consignmentProductPreview.js'
      - 'services/consignmentMatcher.js'
      - 'tests/consignment-beta.test.mjs'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and invariants
        run: |
          node --check server.js
          node --check services/consignmentMatcher.js
          node --check services/consignmentProductPreview.js
          node --check consignment-beta.js
          node --check consignment-customer.js
          node --check services/consignmentFormRules.js
          node --check extension/product-scanner/special-orders-adapter.js
          node --test tests/consignment-beta.test.mjs
      - name: Front-end routes exist
        run: |
          test -s consignment-beta.html
          test -s consignment-customer.html
          test -s consignment-beta.css
          grep -q "app.get('/consignment'" server.js
          grep -q "Consignment" special-orders.html

      - name: HTTP smoke test in isolated runner
        run: |
          npm install --omit=dev --no-audit --no-fund
          PORT=8080 SCANNER_ENABLED=false node server.js > /tmp/consignment-beta-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8080/consignment -o /tmp/consignment-page.html; then break; fi
            sleep 1
          done
          test -s /tmp/consignment-page.html || (cat /tmp/consignment-beta-server.log && exit 1)
          grep -q 'Consignment Management' /tmp/consignment-page.html
          curl -fsS http://127.0.0.1:8080/consignment/submit | grep -q 'Submit your used items'
          curl -fsS http://127.0.0.1:8080/consignment-customer.js | grep -q 'conditionsFor'
          curl -fsS http://127.0.0.1:8080/consignment-form-rules.js | grep -q 'conditionDescriptions'
          curl -fsS http://127.0.0.1:8080/consignment-beta.css | grep -q 'metric'
          curl -fsS http://127.0.0.1:8080/consignment-beta.js | grep -q 'createSubmission'
          curl -fsS http://127.0.0.1:8080/consignment-match-utils.js | grep -q 'normalizeMatches'
