name: First Owner independent signature verification
on:
  pull_request:
    branches:
      - feature/first-real-owner-commissioning-20261109
    paths:
      - 'services/security/firstOwnerAttestation.js'
      - 'services/security/firstOwnerCommissioning.js'
      - 'db/hc_owner_commissioning.sql'
      - 'tests/first-owner-attestation.test.mjs'
      - '.github/workflows/first-owner-signed-attestation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent signatures and first-owner transaction contracts
        run: node --test tests/first-owner-attestation.test.mjs tests/first-owner-commissioning.test.mjs
      - name: Syntax checks
        run: |
          node --check services/security/firstOwnerAttestation.js
          node --check services/security/firstOwnerCommissioning.js
