name: Extension launcher UI regression
on:
  pull_request:
    paths:
      - 'extension/content.js'
      - 'tests/extensionLauncherUiAlignment.test.mjs'
      - '.github/workflows/extension-launcher-ui-check.yml'
  push:
    branches: ['feature/extension-launchers-shared-ui-20261027']
    paths:
      - 'extension/content.js'
      - 'tests/extensionLauncherUiAlignment.test.mjs'
jobs:
  launcher-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check extension/content.js
      - run: node --test tests/extensionLauncherUiAlignment.test.mjs
