name: Purchasing V3 offline workflow
on:
  pull_request:
    branches: [test/hc-foundation-combined-v3-20261124]
    paths:
      - 'services/lightspeed/purchasingReviewWorkflow.js'
      - 'tests/purchasing-foundation-m6.test.mjs'
      - '.github/workflows/hc-purchasing-p6-v3.yml'
permissions:
  contents: read
jobs:
  purchasing-v3-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/purchasing-foundation-m{1,2,3,4,5,6}.test.mjs tests/product-catalog-m3.test.mjs
