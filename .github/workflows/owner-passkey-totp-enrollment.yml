name: First Owner passkey-backed Authenticator enrollment
on:
  pull_request:
    branches: [feature/owner-activation-browser-20261110]
    paths:
      - 'services/security/ownerPasskeyTotpEnrollmentCandidate.js'
      - 'tests/owner-passkey-totp-enrollment-postgres.test.mjs'
      - '.github/workflows/owner-passkey-totp-enrollment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  owner-totp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hc_test
          POSTGRES_PASSWORD: hc_test
          POSTGRES_DB: hc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hc_test -d hc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HC_TEST_DATABASE_URL: postgres://hc_test:hc_test@127.0.0.1:5432/hc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-owner-totp-${{ hashFiles('package.json') }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check services/security/ownerPasskeyTotpEnrollmentCandidate.js
      - run: node --test --test-concurrency=1 tests/owner-passkey-totp-enrollment-postgres.test.mjs tests/primary-timeclock-totp-subsystem.test.mjs
