name: Combined shared foundation integration smoke
on:
  pull_request:
    paths:
      - 'server.js'
      - 'special-orders.js'
      - 'services/publicBasePath.js'
      - 'services/security/coreOperationsRouteInventory.js'
      - 'services/security/coreOperationsBrowserCallerInventory.js'
      - 'services/security/adminNavigationAccess.js'
      - 'services/security/coreOperationsStagingActivation.js'
      - 'services/security/coreOperationsEmployeeDraftAudit.js'
      - 'services/security/coreEmployeePilotGrantReader.js'
      - 'services/security/coreOperationsIsolatedReadPilot.js'
      - 'scripts/bootstrap-isolated-employee-pilot.mjs'
      - 'staging/employee-read-pilot-*'
      - 'staging/isolated-employee-pilot-operator.js'
      - 'db/hc_core_employee_pilot_grants.sql'
      - 'shared-ui/**'
      - '*-client.js'
      - '*.html'
      - 'tests/shared-foundation-composition-contract.test.mjs'
      - 'tests/core-operations-staging-activation.test.mjs'
      - 'tests/core-operations-employee-acceptance.test.mjs'
      - 'tests/core-operations-employee-draft-audit.test.mjs'
      - 'tests/core-operations-isolated-read-pilot-postgres.test.mjs'
      - 'tests/isolated-employee-pilot-runtime-postgres.test.mjs'
      - 'tests/public-base-path.test.mjs'
      - 'tests/*navigation*.test.mjs'
      - 'tests/store-operations-dashboard.test.mjs'
      - 'tests/core-ops-auth-session.test.mjs'
      - '.github/workflows/shared-foundation-security-web.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hc_test
          POSTGRES_PASSWORD: hc_test
          POSTGRES_DB: hc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hc_test -d hc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HC_TEST_DATABASE_URL: postgres://hc_test:hc_test@127.0.0.1:5432/hc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of combined app and authorization paths
        run: |
          node --check server.js
          node --check services/security/coreOperationsStagingActivation.js
          node --check services/security/coreOperationsEmployeeDraftAudit.js
          node --check services/security/coreEmployeePilotGrantReader.js
          node --check services/security/coreOperationsIsolatedReadPilot.js
          node --check tests/core-operations-isolated-read-pilot-postgres.test.mjs
          node --check scripts/bootstrap-isolated-employee-pilot.mjs
          node --check staging/employee-read-pilot-server.js
          node --check staging/isolated-employee-pilot-operator.js
          node --check staging/employee-read-pilot.js
          node --check tests/isolated-employee-pilot-runtime-postgres.test.mjs
          node --check tests/core-operations-staging-activation.test.mjs
          node --check special-orders.js
          node --check services/publicBasePath.js
          node --check shared-ui/operations-nav.mjs
          node --check shared-ui/staff-auth.js
          node --check shared-ui/store-operations.mjs
      - name: Install existing test dependencies only
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Combined contract, old URL compatibility, frontend and read-only Admin
        run: |
          node --test --test-concurrency=1 \
            tests/shared-foundation-composition-contract.test.mjs \
            tests/core-operations-staging-activation.test.mjs \
            tests/core-operations-employee-acceptance.test.mjs \
            tests/core-operations-employee-draft-audit.test.mjs \
            tests/public-base-path.test.mjs \
            tests/hierarchical-navigation.test.mjs \
            tests/hierarchical-navigation-admin.test.mjs \
            tests/store-operations-dashboard.test.mjs \
            tests/core-ops-navigation.test.mjs \
            tests/core-ops-auth-session.test.mjs \
            tests/admin-navigation-access.test.mjs \
            tests/admin-nav-isolated-bridge.test.mjs \
            tests/admin-nav-db-isolated-smoke.test.mjs \
            tests/shared-ui-reconciliation.test.mjs
      - name: Disposable PostgreSQL + real Ed25519 station + SELECT-only employee grant pilot
        run: node --test --test-concurrency=1 tests/core-operations-isolated-read-pilot-postgres.test.mjs
      - name: Test deployable isolated employee pilot runtime, operator registration, and browser assets
        run: node --test --test-concurrency=1 tests/isolated-employee-pilot-runtime-postgres.test.mjs
