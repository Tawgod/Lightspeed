name: Customer sales M1 offline
on:
  push:
    branches: [feature/hc-customer-sales-m1-20261124]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/customer-sales-evidence.test.mjs
