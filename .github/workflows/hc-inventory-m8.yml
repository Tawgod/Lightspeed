name: Inventory M8 disposable transactions
on:
  pull_request:
    branches: ['test/hc-foundation-combined-v5-20261124']
    paths:
      - 'tests/inventory-m8-postgres.test.mjs'
      - '.github/workflows/hc-inventory-m8.yml'
permissions:
  contents: read
jobs:
  offline:
    if: github.head_ref == 'feature/inventory-foundation-m8-v5-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hc_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: hc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hc_test -d hc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HC_TEST_DATABASE_URL: postgresql://hc_test:disposable_ci_only@127.0.0.1:5432/hc_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 964b84d084c0224b251b3ecef0bb1af30f9cdf22
          path: core-m6-dependency
      - name: Compose exact tested dependency without repository duplication
        run: |
          test "$(git -C core-m6-dependency rev-parse HEAD)" = 964b84d084c0224b251b3ecef0bb1af30f9cdf22
          git -C core-m6-dependency show HEAD:services/lightspeed/localTransactionM6.js > services/lightspeed/localTransactionM6.js
          git -C core-m6-dependency show HEAD:tests/fixtures/coreDisposablePg.mjs > tests/fixtures/coreDisposablePg.mjs
          git hash-object services/lightspeed/localTransactionM6.js
          git hash-object tests/fixtures/coreDisposablePg.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node --test tests/inventory-m7-postgres.test.mjs tests/inventory-m8-postgres.test.mjs
