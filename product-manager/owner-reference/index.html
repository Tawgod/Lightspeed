<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hobby Corner | Product Manager</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">HC</div><div><strong>Hobby Corner</strong><small>Product Manager · PAM replacement</small></div></div><div class="top-right"><span class="environment">DEMO • NO LIVE CONNECTIONS</span><label>Employee <select id="userSelect"><option value="Alex">Alex</option><option value="Morgan">Morgan</option><option value="Taylor">Taylor</option></select></label><button id="helpBtn" class="ghost">Guide</button></div></header>
<section class="toolbar"><div class="toolbar-left"><label>Layout <select id="profileSelect"></select></label><button id="renameProfileBtn" class="ghost" title="Rename current layout">Rename</button><span class="bar"></span><button id="columnsBtn">☷ Columns</button><button id="filtersBtn">⚑ Filters <span id="filterCount"></span></button><button id="customBtn" class="ghost">⚙ Custom Fields</button></div><div class="toolbar-right"><button id="bulkBtn" class="ghost">Bulk Edit Selected</button><button id="resetWidthsBtn" class="ghost" title="Restore column widths">Reset Widths</button><button id="discardBtn" class="ghost">Discard Drafts</button><button id="reviewBtn" class="primary">Review Changes <span id="draftBadge">0</span></button></div></section>
<div class="workspace"><main class="grid-section"><div class="searchbar"><div class="search-input"><span>⌕</span><input id="search" placeholder="Search by product name, SKU, UPC or description…" autocomplete="off"></div><label class="checklabel"><input type="checkbox" id="hideInactive"> Hide inactive</label><label class="checklabel"><input type="checkbox" id="issuesOnly"> Issues only</label><label class="checklabel"><input type="checkbox" id="selectedOnly"> Selected only</label><span id="productCount" class="muted"></span></div><div class="table-wrap"><table id="productTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="bottom-bar"><label><input type="checkbox" id="selectVisible"> Select visible</label><span id="selectionCount"></span><span class="spacer"></span><span class="muted">Click a product to view details. Double click an editable cell or use the pencil.</span></div></main><aside id="sidebar"><div class="panel-title"><strong>Product details</strong><span id="detailSku" class="muted">Select a product</span></div><div id="productDetails" class="panel-content"><div class="empty">Choose a product from the table to inspect images, identifiers, differences and notes.</div></div></aside></div>
<div id="overlay" class="overlay hidden"><div id="dialog" class="dialog"><div class="dialog-title"><h2 id="modalTitle">Dialog</h2><button id="modalClose" class="ghost">✕</button></div><div id="modalBody" class="dialog-body"></div><div id="modalFoot" class="dialog-foot"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script></body></html>
