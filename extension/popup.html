<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hobby Corner Toolkit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Hobby Corner Toolkit</h1>
    <div class="sub">Lightspeed X-Series</div>
  </header>

  <section>
    <label for="sale-ref">Invoice / order number</label>
    <div class="row">
      <input id="sale-ref" inputmode="numeric" placeholder="e.g. 20">
      <button id="detect" class="secondary">Detect</button>
    </div>
  </section>

  <section><button id="scan-page" style="width:100%;background:#116b69">Scan Current Supplier Page</button><p style="font-size:12px;color:#555">Preview only — no Lightspeed changes.</p></section>
  <section class="actions">
    <button id="split">Split / Partial Pickup</button>
    <button id="combine">Find Same-Customer Work Orders</button>
  </section>

  <section id="status" class="status"></section>
  <section id="results"></section>

  <script src="popup.js"></script>
  <div style="margin-top:10px">
    <a href="https://special-orders-test-production.up.railway.app/special-orders"
       target="_blank"
       style="display:block;text-align:center;padding:10px 12px;border-radius:7px;background:#0f766e;color:#fff;text-decoration:none;font-weight:700">
      Open Special Orders
    </a>
  </div>
</body>
</html>
